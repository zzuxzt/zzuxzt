name: Update GitHub stats

on:
  workflow_dispatch:
  schedule:
    - cron: '17 1 * * *'
  push:
    branches:
      - master
    paths:
      - '.github/workflows/update-stats.yml'
      - 'scripts/**'
      - 'assets/**'

concurrency:
  group: github-stats-card
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Fetch GitHub statistics and render card
        env:
          GITHUB_TOKEN: ${{ secrets.GH_STATS_TOKEN || github.token }}
        run: python3 scripts/render_github_stats.py

      - name: Commit the verified card and its source snapshot
        env:
          STATS_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add -- profile/github-stats.svg profile/github-stats.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update GitHub statistics card'
          git push origin "HEAD:$STATS_DEFAULT_BRANCH"
